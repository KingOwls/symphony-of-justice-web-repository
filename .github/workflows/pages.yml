name: Deploy Symphony of Justice Archive

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp .nojekyll _site/
          cp -R src _site/src
          cp -R public _site/public
          cat > _site/robots.txt <<'EOF'
          User-agent: *
          Disallow: /public/assets/art/characters/reference/
          Disallow: /public/assets/art/enemies/reference/
          Disallow: /public/assets/art/locations/reference/
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
